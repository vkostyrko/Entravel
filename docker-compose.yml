services:
  postgres:
    image: postgres:16-alpine
    container_name: entravel-postgres
    environment:
      POSTGRES_DB: entravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - entravel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entravel"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: entravel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Entravel.API/Dockerfile
    container_name: entravel-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=entravel;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox-worker:
    build:
      context: .
      dockerfile: Entravel.OutboxWorker/Dockerfile
    container_name: entravel-outbox-worker
    environment:
      DOTNET_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Database=entravel;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Outbox__PollIntervalSeconds: 5
      Outbox__BatchSize: 10
      Outbox__MaxRetryCount: 5
      Outbox__ProcessingTimeoutSeconds: 300
      Outbox__MaxParallelism: 4
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  entravel-postgres-data:

